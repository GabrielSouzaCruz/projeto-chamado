<div class="col-md-3">
    <div class="card shadow-sm border-0 h-100" style="border-left: 5px solid var(--primary-color) !important;">
        <div class="card-body p-4 text-center">
            <small class="text-uppercase fw-bold text-muted d-block mb-2">Total Geral</small>
            <h2 class="fw-bold mb-0 text-dark" id="stat-total">{{ stats.total|default:0 }}</h2>
        </div>
    </div>
</div>
<div class="col-md-3">
    <div class="card shadow-sm border-0 h-100" style="border-left: 5px solid var(--accent-color) !important;">
        <div class="card-body p-4 text-center">
            <small class="text-uppercase fw-bold text-muted d-block mb-2">Aguardando</small>
            <h2 class="fw-bold mb-0 text-warning" id="stat-abertos">{{ stats.abertos|default:0 }}</h2>
        </div>
    </div>
</div>
<div class="col-md-3">
    <div class="card shadow-sm border-0 h-100" style="border-left: 5px solid #0dcaf0 !important;">
        <div class="card-body p-4 text-center">
            <small class="text-uppercase fw-bold text-muted d-block mb-2">Em Execução</small>
            <h2 class="fw-bold mb-0 text-info" id="stat-andamento">{{ stats.em_andamento|default:0 }}</h2>
        </div>
    </div>
</div>
<div class="col-md-3">
    <div class="card shadow-sm border-0 h-100" style="border-left: 5px solid #198754 !important;">
        <div class="card-body p-4 text-center">
            <small class="text-uppercase fw-bold text-muted d-block mb-2">Resolvidos</small>
            <h2 class="fw-bold mb-0 text-success" id="stat-resolvidos">{{ stats.resolvidos|default:0 }}</h2>
        </div>
    </div>
</div>
